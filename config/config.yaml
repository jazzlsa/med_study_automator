app:
  name: "MedStudyAutomator"
  version: "1.0.0"
  log_level: "INFO"
  anki_root_deck: "Medicina"
  anki_ano_deck: "Segundo Ano"

# Tudo que muda de semestre pra semestre (planilha nova, pastas novas do Drive,
# lista de UCs cursadas) fica centralizado aqui - editável pela aba "⚙️
# Configurações" do app.py, sem precisar mexer em código nenhum.
semester:
  spreadsheet_id: "1K0ubSbGSSzmuVIHgI2l9d5TYDvjcHkTTJLmVO25WabM"
  drive_lessons_folder_name: "MedStudy_Aulas"
  drive_flashcards_folder_name: "MedStudy_Flashcards"
  available_ucs:
    - "UC29"
    - "UC17"
    - "UC04"
    - "UC05"
    - "UC11"
    - "UC16"
    - "UC08"
    - "UC06"
    - "UC09"
    - "UC10"
    - "UC21 - TURMA A"
    - "UC21 - TURMA B"
    - "UC24"

storage:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  temp_dir: "data/temp"
  exports_dir: "data/exports"

# Regras para validação de flashcards
flashcards:
  min_cards_per_hour: 8
  max_cards_per_hour: 25
  extract_slide_images: true
  allowed_tags:
    - fisiopatologia
    - semiologia
    - farmacologia
    - diagnostico
    - conduta_terapeutica
    - anatomia_patologica
    - revisao_p1
    - revisao_p2